# BBMR Drive Times — nginx site config (bbmr-drivetimes-prod)
server {
    listen 80 default_server;
    # Catch-all rather than a literal IP, so attaching an Elastic IP (or any
    # future DNS name) does not require editing and reloading this file.
    server_name _;

    root /var/www/drivetimes;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Never cache the live feeds
    location ~* \.json$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Internal setup notes (fonts/, logos/) aren't for public serving —
    # deny regardless of whether they get left in an uploaded folder.
    location ~* /README\.txt$ {
        deny all;
    }
}
